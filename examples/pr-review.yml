# Copy this file to .github/workflows/pr-review.yml in your repository,
# and add ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro or Max, from `claude setup-token`)
# or ANTHROPIC_API_KEY (Anthropic API account).
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: kinu01/claude-pr-review-skill@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # depth: quick   # cheaper: skeptics only on high-severity findings
